[project]
name = "statintel-ai-service"
version = "0.1.0"
description = "RAG & Gemini Grounded AI Service for StatIntel (SIH26101)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "fastembed>=0.4.0",
    "faiss-cpu>=1.9.0",
    "google-genai>=0.1.1",
    "numpy>=1.26.0",
    "requests>=2.32.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
